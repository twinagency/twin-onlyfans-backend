name: Admin OnlyFans sign-in
on:
  push:
    branches: ['codex/admin-onlyfans-signin-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Existing and admin enrollment, connection and browser proof regressions
        run: python -m pytest -q service/tests/test_onlyfans_creator_enrollments_pg.py service/tests/test_onlyfans_connections_pg.py service/tests/test_onlyfans_browser_capture.py
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --prefix creator-sign-in
      - run: npx --prefix creator-sign-in playwright install --with-deps chromium
      - run: node creator-sign-in/check-lifecycle.mjs
      - run: node creator-sign-in/check.mjs
