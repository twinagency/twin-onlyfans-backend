name: Message capacity and concurrency checks
on:
  push:
    branches: ['codex/agency-scale-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Migration preservation and concurrent budget reservations
        run: python -m pytest -q -x service/tests/test_onlyfans_delivery_scale_pg.py service/tests/test_native_pilot_budget_concurrency_pg.py
      - name: Existing schema, manual activation and account isolation regressions
        run: python -m pytest -q -x service/tests/test_onlyfans_foundation_pg.py service/tests/test_onlyfans_creator_enrollments_pg.py service/tests/test_fastt_activation_pg.py service/tests/test_onlyfans_connections_pg.py service/tests/test_native_pilot_concurrency.py
      - name: Concurrent fan scheduling
        run: |
          python service/tests/test_native_pilot_fan_tasks.py
          python service/tests/test_native_pilot_capacity_checks.py
          python service/tests/test_native_pilot_fleet_report.py
          python service/tests/test_native_pilot_budget_admission.py
          python service/tests/test_native_pilot_load_schedule.py
          python service/tests/test_native_pilot_send_io.py
      - name: Existing assembled service and send-boundary regression
        run: python service/tests/test_native_pilot_service.py
      - name: Existing engine boundaries
        run: python service/tests/test_native_pilot_engine.py
      - name: Real engine reviewed media and concurrent fan isolation
        run: python service/tests/test_native_pilot_content.py
  target-load:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fans-per-account: [50, 500, 1000]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Synthetic 100000-per-hour arrivals across ten accounts
        run: |
          mkdir -p test-results
          python service/native_pilot/tools/load_test.py --scenario target_100k --accounts 10 --fans ${{ matrix.fans-per-account }} --throttle 0.25 --concurrent-fans 32 --sim-minutes 5 --scale 1 --require-target-sla --out test-results/capacity.json > test-results/stdout.json 2> test-results/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-capacity-${{ matrix.fans-per-account }}
          path: test-results/
