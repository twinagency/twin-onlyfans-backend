name: Agency proxy and concurrency checks
on:
  push:
    branches: ['codex/agency-scale-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Pool allocation, schema and manual activation regressions
        run: python -m pytest -q service/tests/test_onlyfans_proxy_pool_pg.py service/tests/test_onlyfans_foundation_pg.py service/tests/test_onlyfans_creator_enrollments_pg.py service/tests/test_fastt_activation_pg.py service/tests/test_onlyfans_connections_pg.py service/tests/test_native_pilot_concurrency.py
      - name: Concurrent fan scheduling
        run: python service/tests/test_native_pilot_fan_tasks.py
      - name: Existing assembled service and send-boundary regression
        run: python service/tests/test_native_pilot_service.py
      - name: Existing engine boundaries
        run: python service/tests/test_native_pilot_engine.py
