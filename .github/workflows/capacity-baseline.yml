name: Unchanged production capacity at 90 seconds
on:
  push:
    branches: ['codex/capacity-baseline-90s-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        accounts: [2, 10]
        rate: [60, 120, 180]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - name: Verify application matches deployed revision
        run: |
          git diff --exit-code 06ee3026b80cdf9f0858d744937d0e1cf1a4ae9e -- service ':!service/native_pilot/tools'
          sha256sum service/native_pilot/service.py service/native_pilot/engine.py
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Provision disposable database connections
        run: |
          PGPASSWORD=disposable_test_only psql -h 127.0.0.1 -U postgres -d postgres -c "ALTER SYSTEM SET max_connections=200"
          docker restart $(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')
          for attempt in {1..20}; do pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - name: Match current resource allocation for two creators
        if: matrix.accounts == 2
        run: |
          docker update --memory 256m --memory-swap 256m --cpus .5 $(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')
      - name: Measure unchanged serial processing
        run: |
          mkdir -p test-results
          if [ "${{ matrix.accounts }}" = "2" ]; then
            sudo systemd-run --scope --unit capacity-baseline -p MemoryMax=384M -p MemorySwapMax=0 -p CPUQuota=50%               env PATH="$PATH" ONLYFANS_TEST_PG_URL="$ONLYFANS_TEST_PG_URL" PYTHON_DOTENV_DISABLED=1 GITHUB_SHA="$GITHUB_SHA"               python service/native_pilot/tools/fleet_load.py --accounts 2 --rate-per-account-hour ${{ matrix.rate }} --fans 500 --concurrent-fans 1 --concurrent-sends 1 --provider-latency-seconds 1.6 --history-latency-seconds 1.6 --sim-minutes 10.5 --throttle 20 --out test-results/fleet.json > test-results/stdout.json 2> test-results/progress.log
          else
            python service/native_pilot/tools/fleet_load.py --accounts 10 --rate-per-account-hour ${{ matrix.rate }} --fans 500 --concurrent-fans 1 --concurrent-sends 1 --provider-latency-seconds 1.6 --history-latency-seconds 1.6 --sim-minutes 10.5 --throttle 20 --out test-results/fleet.json > test-results/stdout.json 2> test-results/progress.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.accounts }}-creators-${{ matrix.rate }}-per-hour
          path: test-results/
