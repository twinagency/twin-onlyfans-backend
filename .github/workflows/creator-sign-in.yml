name: Private creator sign-in
on:
  push:
    branches: [codex/creator-selfhosted-connect-20261020]
  pull_request:
    paths: ['creator-sign-in/**', 'loginExtension/interceptor.js', 'Dockerfile.sign-in', 'deploy/creator-sign-in-*', '.github/workflows/creator-sign-in.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --prefix creator-sign-in
      - run: npx --prefix creator-sign-in playwright install --with-deps chromium
      - run: node creator-sign-in/check.mjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.sign-in -t twin-sign-in-check .
      - name: Headed browser with Chromium sandbox and ephemeral storage
        run: |
          docker run --rm --init --user pwuser --read-only --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=deploy/creator-sign-in-seccomp.json --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --shm-size=256m --memory=1536m --cpus=1 --pids-limit=256 -e TWIN_SIGNIN_TEST_HEADED=1 -e TWIN_SIGNIN_TEST_SANDBOX=1 twin-sign-in-check xvfb-run -a node creator-sign-in/check.mjs
