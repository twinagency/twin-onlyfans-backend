name: Ten-process synthetic creator capacity
on:
  push:
    branches: ['codex/agency-scale-20261025']
    paths: ['service/native_pilot/tools/fleet_load.py', '.github/workflows/fleet-capacity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fans-per-account: [50, 500, 1000]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onlyfans-test.txt
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Fleet evidence validation
        run: python service/tests/test_native_pilot_fleet_report.py
      - name: Ten isolated creator processes at 100000 inbound per hour
        run: |
          mkdir -p test-results
          python service/native_pilot/tools/fleet_load.py --fans ${{ matrix.fans-per-account }} --concurrent-fans 32 --sim-minutes 5 --throttle 0.25 --profile --require-target-sla --out test-results/fleet.json > test-results/stdout.json 2> test-results/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten-process-fleet-${{ matrix.fans-per-account }}
          path: test-results/
