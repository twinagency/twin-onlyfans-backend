name: Final deployed retry and readiness boundary
on:
  workflow_dispatch:
    inputs:
      dashboard_archive_url: {type: string, required: true}
      dashboard_archive_sha256: {type: string, required: true}
permissions: {contents: read}
jobs:
  authenticated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: synthetic-acceptance-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONLYFANS_TEST_PG_URL: postgresql+psycopg2://postgres:synthetic-acceptance-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONPATH: service:service/tests
      ONLYFANS_TEST_DASHBOARD: ${{ github.workspace }}/paired-dashboard
      ONLYFANS_TEST_EVIDENCE: ${{ github.workspace }}/browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea5a17ca7079e1d412a02138ff9cb6af4cd71e8d
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r backend/requirements-onlyfans-test.txt
      - name: Validate and unpack exact paired source
        working-directory: backend
        env:
          DASHBOARD_ARCHIVE_SHA256: ${{ inputs.dashboard_archive_sha256 }}
        run: python scripts/prepare-onlyfans-dashboard.py --dashboard-ref bff99537d8af2559704a7286af7bb1a029eecc18 --archive-sha256 "$DASHBOARD_ARCHIVE_SHA256" --destination "$GITHUB_WORKSPACE/paired-dashboard"
      - working-directory: paired-dashboard
        run: |
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Real authenticated handlers and inbox through PostgreSQL
        working-directory: backend
        run: python -m pytest -q service/tests/test_onlyfans_http_pg.py::test_real_authenticated_read_path
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-authenticated-browser
          path: browser-evidence/
