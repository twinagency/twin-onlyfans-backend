name: Final agency CRM PostgreSQL regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: synthetic-acceptance-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONLYFANS_TEST_PG_URL: postgresql+psycopg2://postgres:synthetic-acceptance-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONPATH: service:service/tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d891c2f2bafb381b8a7668ff5110ba02e63d85c3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-onlyfans-test.txt
      - name: Exercise final scope snapshot, upgrades, continuation and identity protections
        run: >-
          python -m pytest -q
          service/tests/test_agency_launch_contracts.py
          service/tests/test_onlyfans_launch_controls_pg.py
          service/tests/test_onlyfans_recent_inbox_pg.py
          service/tests/test_onlyfans_native_memory_pg.py
          service/tests/test_onlyfans_fold_pending_pg.py
          service/tests/test_onlyfans_ledger_history_pg.py
          service/tests/test_onlyfans_ledger_markers_pg.py
          service/tests/test_onlyfans_post_buy_receipt_pg.py
