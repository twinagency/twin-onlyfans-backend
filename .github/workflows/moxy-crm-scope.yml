name: Final deployed retry and readiness boundary
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: synthetic-acceptance-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONLYFANS_TEST_PG_URL: postgresql+psycopg2://postgres:synthetic-acceptance-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONPATH: service:service/tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a4ce8fe5e418fe6d1221b545785d1ad86bcdaa9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-onlyfans-test.txt
      - name: Prove current deployed retry behavior is retained
        run: python -m pytest -q service/tests/test_onlyfans_sync_retry_pg.py
      - name: Prove final read-only scope and complete readiness paths
        run: python -m pytest -q service/tests/test_onlyfans_launch_controls_pg.py -k 'snapshot or readiness_is_real or readiness_uses or explicit_resume'
      - name: Prove scoped search, purchases and chatter guards
        run: python -m pytest -q service/tests/test_agency_launch_contracts.py
