name: Corrected CRM immutable release artifacts
on:
  workflow_call:
    inputs:
      forward_dashboard_url:
        description: Private capability for the pinned corrected dashboard archive
        required: true
        type: string
      rollback_dashboard_url:
        description: Private capability for the pinned compatible rollback dashboard archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {name: backend-forward, backend: f0ecf4f8a21e1f25b84351e1513eafc1fc53ee1a, source: f0ecf4f8a21e1f25b84351e1513eafc1fc53ee1a, dockerfile: Dockerfile.onlyfans, kind: backend}
          - {name: backend-rollback, backend: d6811b124928f8167e6625ce9db5db81bf227fad, source: d6811b124928f8167e6625ce9db5db81bf227fad, dockerfile: Dockerfile.onlyfans, kind: backend}
          - {name: signin-forward, backend: f0ecf4f8a21e1f25b84351e1513eafc1fc53ee1a, source: f0ecf4f8a21e1f25b84351e1513eafc1fc53ee1a, dockerfile: Dockerfile.sign-in, kind: signin}
          - {name: signin-rollback, backend: d6811b124928f8167e6625ce9db5db81bf227fad, source: d6811b124928f8167e6625ce9db5db81bf227fad, dockerfile: Dockerfile.sign-in, kind: signin}
          - {name: dashboard-forward, backend: f0ecf4f8a21e1f25b84351e1513eafc1fc53ee1a, source: 444fd1303858e6d87204efe5811278657571f8f6, dockerfile: Dockerfile, kind: dashboard, archive: 2f0490c863b76107a6eedccc9ab1d66985b71b55487a2952f373859baaf7f9f9}
          - {name: dashboard-rollback, backend: d6811b124928f8167e6625ce9db5db81bf227fad, source: 871b3e8955bf8af357f6f66d56c4446bf98fee8e, dockerfile: Dockerfile, kind: dashboard, archive: e8777331cc074f52234482537b2d6ce55ab430dc17b39454f9f031d6b2f0626a}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.backend }}
          path: backend
          persist-credentials: false
      - name: Prepare immutable source
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          ARTIFACT_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ matrix.source }}
          EXPECTED_ARCHIVE: ${{ matrix.archive }}
          FORWARD_URL: ${{ inputs.forward_dashboard_url }}
          ROLLBACK_URL: ${{ inputs.rollback_dashboard_url }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          if test "$KIND" = dashboard; then
            python - <<'PY'
          import hashlib, os, tarfile, urllib.request
          from pathlib import Path
          url=os.environ['FORWARD_URL'] if os.environ['ARTIFACT_NAME'].endswith('forward') else os.environ['ROLLBACK_URL']
          print('::add-mask::'+url)
          request=urllib.request.Request(url)
          with urllib.request.urlopen(request, timeout=60) as response:
              data=response.read(50000001)
          if len(data)>50000000 or hashlib.sha256(data).hexdigest()!=os.environ['EXPECTED_ARCHIVE']:
              raise SystemExit('Pinned dashboard archive verification failed')
          Path('source.tar.gz').write_bytes(data)
          Path('dashboard').mkdir()
          with tarfile.open('source.tar.gz') as archive:
              archive.extractall('dashboard',filter='data')
          PY
          fi
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
      - name: Build and retain executable image
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          ARTIFACT_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ matrix.source }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          context=backend
          if test "$KIND" = dashboard; then context=dashboard; fi
          tag="twin-crm-$ARTIFACT_NAME:$SOURCE_SHA"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" --build-arg "GIT_SHA=$SOURCE_SHA" -f "$context/$DOCKERFILE" -t "$tag" "$context"
          docker image inspect "$tag" > evidence/image-inspect.json
          docker image inspect "$tag" --format '{{.Id}}' > evidence/image-id.txt
          if test "$KIND" = backend; then
            docker run --rm --network none --entrypoint python "$tag" -m pip freeze > evidence/python-dependencies.txt
          else
            docker run --rm --network none --entrypoint node "$tag" --version > evidence/node-version.txt
          fi
          docker save "$tag" | gzip -n > "evidence/$ARTIFACT_NAME-$SOURCE_SHA.docker.tar.gz"
          cd evidence
          sha256sum *.docker.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: crm-${{ matrix.name }}-${{ matrix.source }}
          path: evidence/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
