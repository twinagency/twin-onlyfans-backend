name: Synthetic worker race diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-worker-diagnostic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: service:service/tests
      ONLYFANS_TEST_PG_URL: postgresql+psycopg2://postgres:synthetic-worker-diagnostic-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements-onlyfans-test.txt
      - name: Repeat only the original two-process worker case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-race-evidence
          git rev-parse HEAD > worker-race-evidence/backend-sha.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          evidence = Path('worker-race-evidence')
          node = 'service/tests/test_onlyfans_worker_pg.py::test_two_full_worker_processes_have_one_native_invocation_and_one_send'
          results = []
          for attempt in range(1, 11):
              log = evidence / f'attempt-{attempt:02}.log'
              junit = evidence / f'attempt-{attempt:02}.xml'
              command = [sys.executable, '-m', 'pytest', '-vv', '-s', '--tb=long', '--junitxml=' + str(junit), node]
              print(f'Attempt {attempt}/10: ' + ' '.join(command), flush=True)
              with log.open('wb') as output:
                  try:
                      result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=75)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              print(log.read_text(errors='replace'), flush=True)
              results.append({'attempt': attempt, 'exitStatus': code, 'log': str(log)})
              (evidence / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              if code and not (evidence / 'first-failure.log').exists():
                  shutil.copyfile(log, evidence / 'first-failure.log')
                  if junit.exists():
                      shutil.copyfile(junit, evidence / 'first-failure.xml')
          raise SystemExit(int(any(result['exitStatus'] for result in results)))
          PY
      - name: Save bounded synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-race-diagnostic-${{ github.sha }}
          path: worker-race-evidence/
          if-no-files-found: error
