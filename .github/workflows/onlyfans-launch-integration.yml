name: Focused browser regression diagnostic
'on':
  workflow_dispatch:
    inputs:
      dashboard_ref:
        description: Exact SHA, matching the committed paired dashboard pin
        type: string
        required: true
      dashboard_archive_url:
        description: Optional short-lived HTTPS S3 git-archive source URL; never logged
        type: string
      dashboard_archive_sha256:
        description: Independently recorded SHA256 of the exact git archive
        type: string
permissions:
  contents: read
jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-acceptance-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONLYFANS_TEST_PG_URL: postgresql+psycopg2://postgres:synthetic-acceptance-only@127.0.0.1:5432/postgres
      ONLYFANS_PERSONALITY_TEST_DATABASE_URL: postgresql+psycopg2://postgres:synthetic-acceptance-only@127.0.0.1:5432/personality_acceptance
      ONLYFANS_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: service:service/tests
      ONLYFANS_TEST_CONTENT: '1'
      ONLYFANS_TEST_OFFER_IMPORT: '1'
      ONLYFANS_TEST_CONTENT_SYNC: '1'
      ONLYFANS_TEST_ONLY_OFFER_IMPORT: '0'
      ONLYFANS_TEST_DASHBOARD: ${{ github.workspace }}/paired-dashboard
      ONLYFANS_TEST_EVIDENCE: ${{ github.workspace }}/focused-browser-evidence
    steps:
    - uses: actions/checkout@v4
      with:
        path: backend
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Validate the exact paired source capability
      id: pair
      working-directory: backend
      shell: bash
      env:
        ONLYFANS_DASHBOARD_READ_TOKEN: ${{ secrets.ONLYFANS_DASHBOARD_READ_TOKEN }}
        REQUESTED_DASHBOARD_REF: ${{ inputs.dashboard_ref }}
        DASHBOARD_ARCHIVE_SHA256: ${{ inputs.dashboard_archive_sha256 }}
      run: "mkdir -p \"$GITHUB_WORKSPACE/release-evidence\"\npython scripts/prepare-onlyfans-dashboard.py \\\n  --dashboard-ref \"$REQUESTED_DASHBOARD_REF\"\
        \ \\\n  --archive-sha256 \"$DASHBOARD_ARCHIVE_SHA256\" \\\n  --github-output \"$GITHUB_OUTPUT\" \\\n  2>&1 | tee \"$GITHUB_WORKSPACE/release-evidence/paired-source.log\"\
        \n"
    - name: Checkout the explicitly authorized paired repository
      if: steps.pair.outputs.mode == 'git'
      uses: actions/checkout@v4
      with:
        repository: twinagency/twin-dashboard
        ref: ${{ steps.pair.outputs.dashboard_sha }}
        path: paired-dashboard
        token: ${{ secrets.ONLYFANS_DASHBOARD_READ_TOKEN }}
        persist-credentials: false
    - name: Verify and unpack the exact paired archive
      if: steps.pair.outputs.mode == 'archive'
      working-directory: backend
      env:
        REQUESTED_DASHBOARD_REF: ${{ steps.pair.outputs.dashboard_sha }}
        DASHBOARD_ARCHIVE_SHA256: ${{ inputs.dashboard_archive_sha256 }}
      run: python scripts/prepare-onlyfans-dashboard.py --dashboard-ref "$REQUESTED_DASHBOARD_REF" --archive-sha256 "$DASHBOARD_ARCHIVE_SHA256"
        --destination "$GITHUB_WORKSPACE/paired-dashboard"
    - name: Install pinned runtimes and matching PostgreSQL clients
      working-directory: backend
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends postgresql-client-16 ffmpeg

        python -m pip install -r requirements-onlyfans-test.txt

        PGPASSWORD=synthetic-acceptance-only createdb -h 127.0.0.1 -U postgres personality_acceptance

        '
    - name: Install the paired lockfile and browser
      working-directory: paired-dashboard
      run: 'npm ci

        node node_modules/playwright/cli.js install --with-deps chromium

        '
    - name: Run the two complete browser-flow regressions (diagnostic only)
      working-directory: backend
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$GITHUB_WORKSPACE/focused-browser-evidence"

        git rev-parse HEAD > "$GITHUB_WORKSPACE/focused-browser-evidence/diagnostic-backend-sha.txt"

        python -m pytest -q -rs --tb=short --junitxml="$GITHUB_WORKSPACE/focused-browser-evidence/browser.xml" service/tests/test_onlyfans_http_pg.py::test_real_authenticated_read_path
        service/tests/test_onlyfans_release_rehearsal_pg.py::test_one_command_demo_smoke_runs_current_screens_and_removes_its_database

        python - <<''CHECK''

        import os,xml.etree.ElementTree as ET

        from pathlib import Path

        cases=list(ET.parse(Path(os.environ[''ONLYFANS_TEST_EVIDENCE''])/''browser.xml'').getroot().iter(''testcase''))

        assert len(cases)==2 and not any(any(case.find(k) is not None for k in (''failure'',''error'',''skipped'')) for case in cases)

        print(''Focused browser diagnostic: both complete flows passed, zero exemptions; not full release acceptance'')

        CHECK

        '
    - name: Preserve focused diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: focused-browser-${{ github.sha }}
        path: focused-browser-evidence/
        if-no-files-found: error
