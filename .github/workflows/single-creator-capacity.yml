name: Single creator 2400 per hour
on:
  push:
    branches: ['codex/single-creator-capacity-20261026']
    paths: ['service/**', '.github/workflows/single-creator-capacity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_test_only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONPATH: service
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-onlyfans-test.txt}
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Verify decision engine prompts and schema are unchanged
        run: |
          git diff --exit-code 06ee3026b80cdf9f0858d744937d0e1cf1a4ae9e -- service/automations service/native_pilot/twin_context.py service/native_pilot/content.py service/db service/onlyfans_runtime/connections.py
      - name: Concurrency isolation and real PostgreSQL budgets
        run: python -m pytest -q -x service/tests/test_native_pilot_concurrency.py service/tests/test_native_pilot_budget_concurrency_pg.py service/tests/test_native_pilot_metadata_reads_pg.py
      - name: Delivery cancellation and worker boundaries
        run: |
          python service/tests/test_native_pilot_fan_tasks.py
          python service/tests/test_native_pilot_budget_admission.py
          python service/tests/test_native_pilot_delivery_pool.py
          python service/tests/test_native_pilot_send_io.py
          python service/tests/test_native_pilot_local_io.py
          python service/tests/test_native_pilot_model.py
      - name: Existing service and engine regression
        run: |
          python service/tests/test_native_pilot_service.py
          python service/tests/test_native_pilot_engine.py
          python service/tests/test_native_pilot_content.py
      - name: Native engine smoke including reviewed media
        run: |
          mkdir -p test-results
          python service/native_pilot/tools/load_test.py --scenario single_creator --native-engine --media-every 5 --rate-per-account-hour 2400 --accounts 1 --fans 500 --concurrent-fans 16 --concurrent-sends 4 --provider-latency-seconds 1.6 --history-latency-seconds 1.6 --sim-minutes 1.5 --scale 1 --throttle 1 --out test-results/smoke.json > test-results/stdout.json 2> test-results/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: single-creator-smoke, path: test-results/}
  load:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        burst: [0, 30]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_test_only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ONLYFANS_TEST_PG_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-onlyfans-test.txt}
      - run: pip install -r requirements-onlyfans-test.txt
      - name: Match current worker and PostgreSQL allocation
        run: |
          PGPASSWORD=disposable_test_only psql -h 127.0.0.1 -U postgres -d postgres -c "ALTER SYSTEM SET max_connections=50"
          docker restart $(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')
          for attempt in {1..20}; do pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker update --memory 256m --memory-swap 256m --cpus .5 $(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')
      - name: One creator 2400 inputs per hour real engine 20 percent reviewed media
        run: |
          mkdir -p test-results
          sudo systemd-run --scope --unit single-creator-capacity -p MemoryMax=384M -p MemorySwapMax=0 -p CPUQuota=50% env PATH="$PATH" ONLYFANS_TEST_PG_URL="$ONLYFANS_TEST_PG_URL" PYTHON_DOTENV_DISABLED=1 python service/native_pilot/tools/load_test.py --scenario single_creator --native-engine --media-every 5 --burst-size ${{ matrix.burst }} --rate-per-account-hour 2400 --accounts 1 --fans 500 --concurrent-fans 16 --concurrent-sends 4 --provider-latency-seconds 1.6 --history-latency-seconds 1.6 --sim-minutes 10.5 --scale 1 --throttle 1 --profile --out test-results/capacity.json > test-results/stdout.json 2> test-results/progress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-creator-burst-${{ matrix.burst }}
          path: test-results/
