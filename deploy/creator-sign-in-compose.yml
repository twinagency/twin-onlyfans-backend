# Add to the native deployment only after the image and target host pass checks.
# Same compose project/network as api and worker. No published browser port.
services:
  creator-sign-in:
    image: ${ONLYFANS_SIGNIN_IMAGE:?Set the tested sign-in image digest}
    init: true
    restart: unless-stopped
    read_only: true
    user: pwuser
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./creator-sign-in-seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    shm_size: 256m
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    environment:
      ONLYFANS_SIGNIN_TOKEN: ${ONLYFANS_SIGNIN_TOKEN:?Set a distinct private sign-in token}
      ONLYFANS_SIGNIN_MAX_BROWSERS: 1
      ONLYFANS_MANAGED_PROXY_BASE_URL: http://managed-proxy:8791
      ONLYFANS_MANAGED_PROXY_TOKEN: ${ONLYFANS_MANAGED_PROXY_TOKEN:?Set the existing private broker token}
      PORT: 8479
      HOST: 0.0.0.0   # private compose network only (expose, no ports); server defaults to loopback
    expose: ['8479']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8479/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 20s
