name: twin-onlyfans
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twin_onlyfans
      POSTGRES_USER: twin_onlyfans
      POSTGRES_PASSWORD: ${ONLYFANS_DB_PASSWORD:?Set a database password}
    volumes:
      - onlyfans-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin_onlyfans -d twin_onlyfans"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: Dockerfile.onlyfans
    restart: unless-stopped
    env_file: ${ONLYFANS_ENV_FILE:-onlyfans.env}
    environment:
      ONLYFANS_PROCESS_ROLE: api
      VAULT_IMAGE_DIR: /var/lib/twin-vault/images
      VAULT_SPOOL_DIR: /var/lib/twin-vault/spool
      DATABASE_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
    ports:
      - "127.0.0.1:${ONLYFANS_API_PORT:-8788}:8787"
    volumes:
      - onlyfans-vault-images:/var/lib/twin-vault/images:ro
      - onlyfans-vault-spool:/var/lib/twin-vault/spool
    depends_on:
      database:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.onlyfans
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ${ONLYFANS_ENV_FILE:-onlyfans.env}
    environment:
      ONLYFANS_PROCESS_ROLE: worker
      VAULT_IMAGE_DIR: /var/lib/twin-vault/images
      VAULT_SPOOL_DIR: /var/lib/twin-vault/spool
      VAULT_UPLOAD_PART_CONCURRENCY: 2
      DATABASE_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
    command: ["python", "-m", "service.onlyfans_worker"]
    volumes:
      - onlyfans-vault-images:/var/lib/twin-vault/images
      - onlyfans-vault-spool:/var/lib/twin-vault/spool
    depends_on:
      database:
        condition: service_healthy
  # Persistent FASTT runner for ONE account and ONE fan (native_pilot/service.py). Same image and
  # secrets as the worker; no deadline, supervised by restart. Not started by a plain
  # `compose up`: opt in with `--profile fastt`. The account, fan and handle come from
  # FASTT_ACCOUNT / FASTT_FAN / FASTT_HANDLE (no defaults on purpose). Without
  # --enable-send it only runs the read-only preflight and exits. Its send cap is the
  # account's existing delivery allowance (limit_units / used_units / throttle_seconds).
  fastt-runner:
    profiles: ["fastt"]
    build:
      context: ..
      dockerfile: Dockerfile.onlyfans
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ${ONLYFANS_ENV_FILE:-onlyfans.env}
    environment:
      ONLYFANS_PROCESS_ROLE: worker
      DATABASE_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
    working_dir: /app/service
    command: ["python", "-m", "native_pilot.service",
              "--account", "${FASTT_ACCOUNT:?Set FASTT_ACCOUNT, for example of-<owner>}",
              "--fan", "${FASTT_FAN:?Set FASTT_FAN}",
              "--handle", "${FASTT_HANDLE:?Set FASTT_HANDLE}",
              "--twin-context", "--enable-send"]
    depends_on:
      database:
        condition: service_healthy
  # Runner supervisor: ONE container that starts/stops/restarts one `native_pilot.service` child
  # process per active account (database-driven; no Docker socket, no web-app control). Opt in with
  # `--profile fastt-supervisor`. It reads ONLYFANS_FASTT_SCOPE (who may send), FASTT_HANDLES
  # (optional `of-<owner>:<handle>,...` overrides; the binding's stored handle is the default) and
  # writes its manifests and a health file under /var/lib/fastt (named volume below).
  # NEVER run this together with `fastt-runner` for the same account: two senders for one account.
  # Rollback = stop this service and start `fastt-runner` (unchanged above) on the previous image.
  fastt-supervisor:
    profiles: ["fastt-supervisor"]
    build:
      context: ..
      dockerfile: Dockerfile.onlyfans
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: ${ONLYFANS_ENV_FILE:-onlyfans.env}
    environment:
      ONLYFANS_PROCESS_ROLE: worker
      DATABASE_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
      FASTT_MANIFEST_DIR: /var/lib/fastt/manifests
      FASTT_SUPERVISOR_STATUS: /var/lib/fastt/supervisor-status.json
    working_dir: /app/service
    command: ["python", "-m", "native_pilot.supervisor"]
    volumes:
      - onlyfans-fastt:/var/lib/fastt
    depends_on:
      database:
        condition: service_healthy
  migrate:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: Dockerfile.onlyfans
    environment:
      ONLYFANS_PROCESS_ROLE: worker
      DATABASE_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
      ONLYFANS_MIGRATION_URL: postgresql+psycopg2://twin_onlyfans:${ONLYFANS_DB_PASSWORD:?Set a database password}@database:5432/twin_onlyfans
    entrypoint: ["python", "-m", "service.db.schema"]
    command: ["check"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  onlyfans-postgres:
  onlyfans-vault-images:
  onlyfans-vault-spool:
  onlyfans-fastt:
