# Alembic config for the relay. Most knobs left at defaults; the
# script_location + sqlalchemy.url are filled programmatically by
# service/db/engine.py:init_db() so this file is mainly for the
# `alembic` CLI when you want to inspect / generate migrations by hand.

[alembic]
# Resolve relative to this alembic.ini file (not the CWD), so the CLI works
# from any directory: `alembic -c service/db/migrations/alembic.ini ...`.
script_location = %(here)s
sqlalchemy.url = sqlite:///service/chatterly.db

# Filename template includes a unix timestamp prefix so migrations sort
# chronologically even when generated on different machines.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# NO `version_locations`. Revisions live in the standard `versions/`
# subdirectory of script_location, which is already Alembic's default, and
# declaring it explicitly BROKE discovery rather than helping: `%(here)s`
# expands to an absolute path, and with `version_path_separator` unset Alembic
# falls back to its legacy split-on-space-or-comma. On any checkout whose path
# contains a space — this one does — `...\TWIN CLONE CREATION\...\versions`
# became THREE locations, none of which exist, and the CLI reported zero
# revisions in the tree. Unset, Alembic uses `os.path.join(script_location,
# "versions")`: one path, never split. env.py stays at script_location root,
# which is where Alembic requires it. (Re-adding this line requires setting
# `version_path_separator = os` as well.)

[post_write_hooks]
# Empty; we don't auto-format generated migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
